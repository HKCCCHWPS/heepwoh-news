<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>協小新聞台 · 新聞報道</title>
<style>
:root{--red:#C8102E;--bg:#100e0c;--card:#1d1916;--line:#332c26;--muted:#a89a8c;--gold:#E9C46A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:#f3ede6;font-family:"Microsoft JhengHei","華康中圓體",sans-serif;padding-bottom:190px}
header{padding:18px 16px 8px;text-align:center}
header .badge{display:inline-block;background:var(--red);color:#fff;font-size:12px;padding:3px 12px;border-radius:999px;letter-spacing:1px}
header h1{margin:10px 0 4px;font-size:26px;letter-spacing:2px}
header p{margin:0;color:var(--muted);font-size:13px}
.hero{margin:14px;background:linear-gradient(135deg,#8B1E3F,#C8102E);border-radius:18px;padding:18px 18px 16px}
.hero .d{font-size:13px;opacity:.9;letter-spacing:1px}
.hero .t{font-size:21px;font-weight:700;margin:6px 0 4px;letter-spacing:1px}
.hero .m{font-size:12.5px;opacity:.9}
.hero button{margin-top:14px;width:100%;background:#fff;color:var(--red);border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;letter-spacing:2px}
.chap{margin:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer}
.chip:active{transform:scale(.985)}
.chip.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(200,16,46,.3) inset}
.chip b{display:block;font-size:17px;margin-bottom:3px;letter-spacing:1px}
.chip span{font-size:12px;color:var(--muted)}
h3{margin:22px 16px 8px;font-size:14px;color:var(--muted);font-weight:400;letter-spacing:1px}
.list{margin:0 14px}
.ep{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.ep .t{flex:1;min-width:0}
.ep .t b{display:block;font-size:15px}
.ep .t span{font-size:12px;color:var(--muted)}
.ep button{background:#2a231d;color:#fff;border:0;border-radius:9px;padding:9px 13px;font-size:13px}
#bar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;background:#181412;border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));z-index:30}
#bar .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#bar .tt{flex:1;min-width:0}
#bar .tt b{display:block;font-size:13.5px}
#bar .tt span{font-size:11px;color:var(--muted)}
#seek{width:100%;accent-color:var(--red)}
#bar .row{display:flex;align-items:center;gap:8px;margin-top:5px}
#bar .row button{background:#2a231d;color:#fff;border:0;border-radius:8px;padding:9px 11px;font-size:13px;flex:1}
#bar .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.hint{color:#6f6459;font-size:11.5px;text-align:center;padding:14px 20px 0}
</style>
</head>
<body>
<header>
  <span class="badge">C.C.C. HEEP WOH · 新聞報道</span>
  <h1>🦌 協小新聞台</h1>
  <p>本港｜國際｜體育｜文化藝術 · 每節約 1 分半</p>
</header>

<div class="hero" id="hero">
  <div class="d" id="hdate">—</div>
  <div class="t">今日新聞報道</div>
  <div class="m" id="hmeta">—</div>
  <button id="bigbtn" onclick="playFrom(0)">▶ 開始收聽</button>
</div>

<div class="chap" id="chap"></div>
<div class="hint">撳任何一節即由該節開始播放</div>

<h3>過去集數</h3>
<div class="list" id="list"></div>

<div id="bar">
  <div class="top">
    <div class="tt"><b id="bt">未播放</b><span id="bs">撳上面開始</span></div>
  </div>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <div class="row">
    <button onclick="jump(-15)">« 15秒</button>
    <button id="pp" onclick="toggle()">▶ 播放</button>
    <button onclick="jump(15)">15秒 »</button>
    <button onclick="navChap(1)">下一節 ▶</button>
    <div class="tm" id="tm">0:00 / 0:00</div>
  </div>
</div>
<audio id="au" preload="metadata"></audio>

<script>
let META=null, au=document.getElementById('au');
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

fetch('bulletin.json').then(r=>r.json()).then(m=>{
  META=m;
  document.getElementById('hdate').textContent=m.date;
  document.getElementById('hmeta').textContent=fmt(m.sec)+'分鐘 · '+m.chars+'字 · 4 節';
  document.getElementById('chap').innerHTML=m.chapters.filter(c=>c.label!=='開場').map((c,i)=>
    `<div class="chip" data-i="${m.chapters.indexOf(c)}" onclick="playFrom(${c.t})">
      <b>${c.label}</b><span>${fmt(c.t)} 開始 · ${c.sec}秒</span></div>`).join('');
  document.getElementById('list').innerHTML=
    `<div class="ep"><div class="t"><b>${m.date}　新聞報道</b><span>${fmt(m.sec)}分鐘 · 本港／國際／體育／文化藝術</span></div>
     <button onclick="playFrom(0)">▶ 播</button></div>`;
  au.src=m.file;
  au.addEventListener('timeupdate',tick);
  au.addEventListener('ended',()=>{document.getElementById('pp').textContent='▶ 播放'});
  au.addEventListener('loadedmetadata',tick);
}).catch(e=>{document.getElementById('hmeta').textContent='載入失敗：'+e.message});

function playFrom(t){au.currentTime=t;au.play();document.getElementById('pp').textContent='❚❚ 暫停';markActive(t)}
function toggle(){if(au.paused){au.play();document.getElementById('pp').textContent='❚❚ 暫停'}else{au.pause();document.getElementById('pp').textContent='▶ 播放'}}
function jump(d){if(au.duration)au.currentTime=Math.min(au.duration,Math.max(0,au.currentTime+d))}
function navChap(dir){
  if(!META)return;
  const ts=META.chapters.map(c=>c.t), cur=au.currentTime;
  let target=null;
  if(dir>0){target=ts.find(t=>t>cur+1);}
  else{const back=ts.filter(t=>t<cur-2);target=back.length?back[back.length-1]:0}
  playFrom(target==null?(dir>0?au.duration:0):target);
}
function markActive(t){
  if(!META)return;
  const idx=META.chapters.reduce((a,c,i)=>c.t<=t+0.5?i:a,0);
  [...document.querySelectorAll('.chip')].forEach(el=>el.classList.toggle('on',+el.dataset.i===idx));
  document.getElementById('bt').textContent=META.chapters[idx].label;
}
function tick(){
  const d=au.duration||META?.sec||0;
  document.getElementById('seek').value=au.currentTime/d*1000;
  document.getElementById('tm').textContent=fmt(au.currentTime)+' / '+fmt(d);
  document.getElementById('bs').textContent=META?getSectionName(au.currentTime):'';
  markActive(au.currentTime);
}
function getSectionName(t){
  if(!META)return'';
  const c=META.chapters.reduce((a,x)=>x.t<=t+0.5?x:a,META.chapters[0]);
  return '現正播放：'+c.label;
}
document.getElementById('seek').addEventListener('input',e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration});
</script>
</body></html>
